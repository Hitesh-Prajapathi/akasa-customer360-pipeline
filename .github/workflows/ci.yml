name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, run the pipeline end to end on the sample data, then run the test suite.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff

      - name: Lint (ruff)
        run: ruff check --select F,I,E9 customer360 dashboard tests run_pipeline.py

      - name: Smoke run pipeline
        run: python run_pipeline.py

      - name: Run tests
        run: pytest -q

      - name: Upload DQ / insight reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dq-reports
          path: output/reports/
          if-no-files-found: warn

  # Build the production image and run the pipeline inside it; fails on non-zero exit.
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t customer360 .

      - name: Run pipeline in container
        run: docker run --rm customer360
